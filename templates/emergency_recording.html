<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Emergency Audio Recording | SafeHer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='dashboard.css') }}">


</head>


<body>
    <div id="google_translate_element"
     style="display:none;">
</div>


<div class="container">

    <div class="card shadow-lg record-card">


        <!-- Header -->

        <div class="text-center">

            <div class="record-icon">

                <i class="bi bi-mic-fill"></i>

            </div>


            <h2 class="mt-4">

                Emergency Audio Recording

            </h2>


            <p>

                Record audio during an emergency.
                Your recording will be saved automatically
                when you stop recording.

            </p>

        </div>


        <!-- Timer -->

        <div
            id="timer"
            class="text-center">

            00:00

        </div>


        <!-- Status -->

        <div
            id="recordingStatus"
            class="alert alert-secondary text-center">

            Ready to record

        </div>


        <!-- Start Button -->

        <button
            id="startButton"
            type="button"
            class="btn btn-danger btn-lg w-100">

            <i class="bi bi-mic-fill"></i>

            Start Recording

        </button>


        <!-- Stop Button -->

        <button
            id="stopButton"
            type="button"
            class="btn btn-dark btn-lg w-100">

            <i class="bi bi-stop-fill"></i>

            Stop Recording

        </button>


        <!-- Recording History -->

        <div class="mt-5">

            <h4 class="mb-3">

                <i class="bi bi-clock-history"></i>

                Recording History

            </h4>


            <a
                href="{{ url_for('recording_history') }}"
                class="btn btn-outline-danger w-100">

                <i class="bi bi-folder2-open"></i>

                View Recording History

            </a>

        </div>


        <!-- Back -->

        <a
            href="{{ url_for('dashboard') }}"
            class="btn btn-outline-light w-100 mt-3">

            <i class="bi bi-arrow-left"></i>

            Back to Dashboard

        </a>


    </div>

</div>


<!-- Emergency Recording JavaScript -->

<script
    src="{{ url_for(
        'static',
        filename='emergency_recording.js'
    ) }}">
</script>

<script src="{{ url_for('static', filename='language.js') }}"></script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
