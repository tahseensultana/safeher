<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Incident | SafeHer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="{{ url_for('static', filename='report.css') }}">

</head>

<body>
    <div id="google_translate_element"
     style="display:none;">
</div>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="report-card">

<div class="text-center mb-4">

<div class="report-icon">

<i class="bi bi-exclamation-triangle-fill"></i>

</div>

<h2>Report an Incident</h2>

<p>Your report helps make the community safer.</p>

</div>

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

<div class="alert alert-{{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST" enctype="multipart/form-data">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Incident Type

</label>

<select class="form-select"

name="incident_type"

required>

<option value="">Choose Incident</option>

<option>Harassment</option>

<option>Stalking</option>

<option>Physical Assault</option>

<option>Domestic Violence</option>

<option>Kidnapping Attempt</option>

<option>Theft</option>

<option>Cyber Crime</option>

<option>Suspicious Activity</option>

<option>Medical Emergency</option>

<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Severity

</label>

<select class="form-select"

name="severity"

required>

<option value="">Select Severity</option>

<option>Low</option>

<option>Medium</option>

<option>High</option>

<option>Emergency</option>

</select>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Describe the Incident

</label>

<textarea

class="form-control"

rows="6"

name="description"

placeholder="Describe what happened..."

required>

</textarea>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Latitude

</label>

<input

type="text"

id="latitude"

name="latitude"

class="form-control"

readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Longitude

</label>

<input

type="text"

id="longitude"

name="longitude"

class="form-control"

readonly>

</div>

</div>

<div class="mb-3">

<button

type="button"

class="btn btn-danger"

id="locationBtn">

<i class="bi bi-geo-alt-fill"></i>

Get Current Location

</button>

</div>

<div class="mb-3">

<label class="form-label">

Upload Evidence (Optional)

</label>

<input

type="file"

class="form-control"

name="image"

id="imageInput"

accept="image/*">

</div>

<div class="mb-3 text-center">

<img

id="preview"

src=""

class="img-fluid rounded shadow"

style="max-height:250px;display:none;">

</div>

<div class="form-check mb-4">

<input

class="form-check-input"

type="checkbox"

name="anonymous"

id="anonymous">

<label

class="form-check-label"

for="anonymous">

Submit as Anonymous

</label>

</div>

<div class="d-grid gap-2">

<button

type="submit"

class="btn btn-danger btn-lg">

<i class="bi bi-send-fill"></i>

Submit Report

</button>

<a

href="{{ url_for('dashboard') }}"

class="btn btn-outline-light btn-lg">

<i class="bi bi-arrow-left"></i>

Back to Dashboard

</a>

</div>

</form>

</div>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='report.js') }}"></script>

<script src="{{ url_for('static', filename='language.js') }}"></script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
