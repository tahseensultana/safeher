<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/css/intlTelInput.css">
    <link rel="stylesheet"
    href="{{ url_for('static', filename='dashboard.css') }}">

</head>

<body>
    <div id="google_translate_element"
     style="display:none;">
</div>

    <div class="container py-5">

        <div class="card shadow-lg p-4 mx-auto" style="max-width:700px;">

            <div class="text-center">

                {% if user[3] %}

                <img
                    id="profileImage"
                    src="{{ url_for(
                        'static',
                        filename='uploads/profile/' + user[3]
                    ) }}"
                    class="rounded-circle mb-3"
                    width="140"
                    height="140"
                    style="object-fit:cover;">

                {% else %}

                <img
                    id="profileImage"
                    src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                    class="rounded-circle mb-3"
                    width="140"
                    height="140"
                    style="object-fit:cover;">

                {% endif %}

                <h2>My Profile</h2>


            </div>


            <div id="viewMode">

                <div class="mb-3">

                    <label class="fw-bold">
                    Full Name
                    </label>

                    <p>
                    {{ user[0] }}
                    </p>

                </div>

                <div class="mb-3">

                    <label class="fw-bold">
                    Email
                    </label>

                    <p>
                    {{ user[1] }}
                    </p>

                </div>

                <div class="mb-4">

                    <label class="fw-bold">
                    Phone
                    </label>

                    <p>
                    {{ user[2] }}
                    </p>

                </div>

                <div class="text-center">

                    <button
                    class="btn btn-danger"
                    onclick="editProfile()">

                    Edit Profile

                    </button>

                </div>

            </div>


            <div id="editMode" style="display:none;">

                <form method="POST"
                    action="{{ url_for('update_profile') }}"
                    onsubmit="return preparePhone()"
                    enctype="multipart/form-data">

                    <div class="text-center mb-4">

                        <input
                        type="file"
                        class="form-control"
                        name="profile_photo"
                        accept="image/*">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                        Full Name
                        </label>

                        <input
                        type="text"
                        name="fullname"
                        class="form-control"
                        value="{{ user[0] }}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                        Email
                        </label>

                        <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user[1] }}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                        Phone Number
                        </label>

                        <input
                        id="phone"
                        type="tel"
                        name="phone"
                        class="form-control"
                        value="{{ user[2] }}"
                        required>

                    </div>

                    <div class="text-center mt-4">

                        <button type="submit"
                        class="btn btn-success btn-lg">

                            Save Profile Changes

                        </button>

                    </div>

                </form>

                    <hr>

                    <h4 class="mb-3">

                    Change Password

                    </h4>

                <form method="POST"
                  action="{{ url_for('change_password') }}">

                    <div class="mb-3">

                        <label>Current Password</label>

                        <input
                        type="password"
                        name="current_password"
                        class="form-control"
                        required>

                    </div>

                    <div class="mb-3">

                        <label>New Password</label>

                        <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        required>

                    </div>

                    <div class="mb-4">

                        <label>Confirm Password</label>

                        <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        required>

                    </div>

                    <div class="text-center">

                        <button
                        type="submit"
                        class="btn btn-danger btn-lg">

                        Change Password

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script>

        function editProfile(){

        document.getElementById("viewMode").style.display="none";

        document.getElementById("editMode").style.display="block";

        }

        function cancelEdit(){

        document.getElementById("viewMode").style.display="block";

        document.getElementById("editMode").style.display="none";

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/js/intlTelInput.min.js"></script>

<script>

const phoneInput = document.querySelector("#phone");

const iti = window.intlTelInput(phoneInput, {

    initialCountry: "bd",

    preferredCountries: ["bd", "in", "us", "gb"],

    separateDialCode: true,

    nationalMode: true,

    strictMode: true,

    loadUtils: () =>
        import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.0/build/js/utils.js")

});

</script>
<script>

function preparePhone() {

    if (!iti.isValidNumber()) {
        alert("Please enter a valid phone number.");
        return false;
    }

    document.querySelector("#phone").value = iti.getNumber();

    return true;
}

</script>
<script src="{{ url_for('static', filename='language.js') }}"></script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
