<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Safe Route | SafeHer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css">

<link rel="stylesheet"
href="{{ url_for('static',filename='route.css') }}">

</head>

<body>
    <div id="google_translate_element"
     style="display:none;">
</div>

<div class="container py-5">

    <div class="row card shadow-lg border-0 rounded-4 p-4">
        <div class="col-lg-4 control-panel">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                <h2>

                <i class="bi bi-shield-check"></i>

                Safe Route

                </h2>

                <p>

                Find the safest route while avoiding reported danger areas.

                </p>
                </div>


                <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-outline-light">

                <i class="bi bi-arrow-left"></i>

                Back

                </a>

            </div>

            <hr>

            <label class="form-label">

                Destination

            </label>

            <input
            type="text"
            id="destination"
            class="form-control"
            placeholder="Example: Dhanmondi, Dhaka">

            <button
                id="findRoute"
                class="btn btn-danger w-100 mt-3">

                <i class="bi bi-sign-turn-right-fill"></i>

                Find Safe Route

            </button>

            <div class="info-box mt-4">

                <h5>

                    <i class="bi bi-geo-alt-fill"></i>

                    Current Status

                </h5>

                <p id="status">

                    Getting your location...

                </p>

            </div>

            <div class="info-box mt-3">

                <div id="dangerAlert"
                class="alert alert-danger mt-3"
                style="display:none; margin-bottom:0;">

            </div>

        </div>

        <div class="info-box mt-4">

            <h5>Danger Levels</h5>

            <p>
                🔴 High Risk
            </p>

            <p>
                🟠 Medium Risk
            </p>

            <p>
               🟡 Low Risk
            </p>

        </div>

        <div class="alert alert-info mt-3" id="rerouteInfo" style="display:none;"></div>

        <div class="info-box">

            <h5>

                <i class="bi bi-signpost-split-fill"></i>

                Distance

            </h5>

            <p id="distance">

                --

            </p>

        </div>

        <div class="info-box">

            <h5>

                <i class="bi bi-clock-fill"></i>

                Estimated Time

            </h5>

            <p id="duration">

                --

            </p>

        </div>

        

        <div class="col-lg-8 p-0">

            <div id="map"></div>

        </div>


    </div>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Geocoder -->
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<!-- Routing Machine -->
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
const dangerLocations = {{ danger_locations|tojson }};
</script>

<script src="{{ url_for('static', filename='route.js') }}"></script>
<script src="{{ url_for('static', filename='language.js') }}"></script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
