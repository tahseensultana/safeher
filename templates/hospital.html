<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nearby Hospitals</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='dashboard.css') }}">

</head>

<body>
    <div id="google_translate_element"
     style="display:none;">
</div>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="text-danger fw-bold">
                🏥 Nearby Hospitals
            </h2>


        </div>

        <a href="{{ url_for('dashboard') }}"
            class="btn btn-outline-danger">

            ← Dashboard

        </a>

    </div>

<div class="card shadow-lg border-0 rounded-4">

<div class="card-body">

<div class="row mb-4">

<div class="col-md-4">

<label class="form-label">

Search Radius

</label>

<select id="radius" class="form-select">

<option value="1000">1 km</option>
<option value="3000">3 km</option>
<option value="5000" selected>5 km</option>
<option value="10000">10 km</option>

</select>

</div>

<div class="col-md-4 d-flex align-items-end">

<button
class="btn btn-danger w-100"
onclick="findHospitals()">

🏥 Find Nearby Hospitals

</button>

</div>

</div>

<div id="loading"
class="text-center"
style="display:none;">

<div class="spinner-border text-danger"></div>

<p class="mt-2">

Searching nearby hospitals...

</p>

</div>

<div id="map"></div>

</div>

</div>

<div id="nearestCard"
class="card border-success shadow mt-4"
style="display:none;">

<div class="card-body">

<h4 class="text-success">

⭐ Nearest Hospital

</h4>

<div id="nearestHospital"></div>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-body">

<h4>

🏥 Hospitals Nearby

</h4>

<div id="results">

<div class="text-center py-5 text-muted">

<h1>

🏥

</h1>

<p>

Click <strong>Find Nearby Hospitals</strong> to begin.

</p>

</div>

</div>

</div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='hospital.js') }}"></script>
<script src="{{ url_for('static', filename='language.js') }}"></script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
