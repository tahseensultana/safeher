<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Emergency Recordings | SafeHer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='dashboard.css') }}">

</head>


<body>


<div class="container py-5">

    <div class="card shadow-lg p-4">


        <!-- Header -->

        <h2 class="mb-4">

            <i class="bi bi-mic-fill text-danger"></i>

            Emergency Recordings

        </h2>


        <!-- Recordings -->

        {% if recordings %}


            {% for recording in recordings %}

                <div class="card mb-3 p-3">


                    <div class="d-flex justify-content-between
                                align-items-center">


                        <div>

                            <h5 class="mb-1">

                                <i class="bi bi-file-earmark-music
                                          text-danger"></i>

                                Emergency Recording

                            </h5>


                            <small class="text-muted">

                                <i class="bi bi-calendar3"></i>

                                {{ recording[3] }}

                            </small>


                            <br>


                            <small class="text-muted">

                                <i class="bi bi-clock"></i>

                                Duration:
                                {{ recording[2] }} seconds

                            </small>

                        </div>


                    </div>


                    <!-- Audio player -->

                    <!-- Audio Player -->

<audio
    controls
    preload="metadata"
    class="w-100 mt-3">

    <source
        src="{{ url_for(
            'static',
            filename='uploads/recordings/' + recording[1]
        ) }}">

    Your browser does not support audio playback.

</audio>


                </div>

            {% endfor %}


        {% else %}


            <div class="alert alert-secondary">

                <i class="bi bi-info-circle"></i>

                No emergency recordings found.

            </div>


        {% endif %}


        <!-- Buttons -->

        <div class="mt-4">


            <a
                href="{{ url_for('emergency_recording') }}"
                class="btn btn-danger">

                <i class="bi bi-mic-fill"></i>

                New Recording

            </a>


            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left"></i>

                Dashboard

            </a>


        </div>


    </div>

</div>


</body>

</html>
