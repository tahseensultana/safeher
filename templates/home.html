<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>SafeHer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="responsive no-outline">
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold href="/">
            SafeHer
            </a>
            <div>
                <a href="/login" class="btn btn-outline-light me-2">
                Login
                </a>

                <a href="/register" class="btn btn-danger">
                Register
                </a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>SafeHer</h1>
            <p>
            Empowering women with safety, support,
            and emergency assistance anytime, anywhere.
            </p>
            <a href="/get-started" class="btn btn-danger btn-lg btn-custom">
                Get Started
            </a>
        </div>
    </section>
    <div class="section-divider"></div>

    <section class="summary py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h2>About SafeHer</h2>
                <p class="lead ">
                A smart safety platform designed to help women stay connected,
                protected, and supported during emergencies.
                </p>
            </div>
        </div>
    </section>
    <footer class="mt-5 text-center">

        <p style="color:#f8c9c9">

            SafeHer © 2026

        </p>

    </footer>
</body>
</html>
